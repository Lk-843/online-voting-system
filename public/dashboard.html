<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoteSecure – Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .hero-banner {
      background: var(--gradient);
      border-radius: var(--radius);
      padding: 2rem 2.5rem;
      color: #fff;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .hero-banner::before {
      content: '🗳️';
      position: absolute;
      right: 2rem; top: 50%;
      transform: translateY(-50%);
      font-size: 5rem;
      opacity: 0.12;
    }
    .hero-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 4px; }
    .hero-sub { font-size: 0.875rem; opacity: 0.85; }

    /* Election Section */
    .election-section {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.9);
      transition: var(--transition);
    }
    .election-section:hover { box-shadow: var(--shadow-lg); }

    /* Election Header */
    .election-header {
      padding: 1.5rem;
      border-bottom: 2px solid var(--bg);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      position: relative;
    }
    .election-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--gradient);
    }
    .election-section.closed .election-header::before { background: linear-gradient(135deg,#9CA3AF,#6B7280); }
    .election-section.upcoming .election-header::before { background: linear-gradient(135deg,#BFDBFE,#93C5FD); }

    .election-title { font-size: 1.15rem; font-weight: 900; color: var(--primary); }
    .election-desc { font-size: 0.83rem; color: var(--text-muted); margin-top: 5px; }
    .election-meta { display: flex; align-items: center; gap: 1rem; margin-top: 8px; flex-wrap: wrap; }
    .election-meta span { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 4px; }

    /* Candidates Section */
    .candidates-section { padding: 1.5rem; }
    .candidates-section-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .candidates-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    /* Candidate Card */
    .candidate-card {
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1.1rem;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      background: #FAFBFF;
      text-align: center;
    }
    .candidate-card:hover {
      border-color: var(--secondary);
      background: #EFF6FF;
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    .candidate-card.selected {
      border-color: var(--secondary);
      background: linear-gradient(135deg,#EFF6FF,#DBEAFE);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .candidate-card.selected::after {
      content: '✓';
      position: absolute; top: 8px; right: 8px;
      width: 22px; height: 22px;
      background: var(--gradient);
      color: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 800;
    }
    .candidate-avatar {
      width: 52px; height: 52px;
      background: var(--gradient);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 900; color: #fff;
      margin: 0 auto 10px;
      box-shadow: 0 4px 12px rgba(30,58,138,0.25);
    }
    .candidate-name { font-weight: 800; font-size: 0.9rem; color: var(--primary); }
    .candidate-party { font-size: 0.75rem; color: var(--secondary); font-weight: 600; margin-top: 3px; }
    .candidate-bio { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

    /* Vote Action Bar */
    .vote-action {
      padding: 1rem 1.5rem;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .vote-confirm-inline {
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .vote-confirm-inline.show { display: flex; }
    .confirm-text { font-size: 0.875rem; font-weight: 700; color: var(--primary); }
    .confirm-text span { color: var(--secondary); }

    /* Voted Banner */
    .voted-banner {
      padding: 1rem 1.5rem;
      background: linear-gradient(135deg,#D1FAE5,#ECFDF5);
      border-top: 1px solid #A7F3D0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      color: #065F46;
    }

    .section-heading { font-size: 1.1rem; font-weight: 800; color: var(--primary); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px; }

    /* Vote count badge on candidate */
    .vote-badge { position: absolute; top: 8px; left: 8px; background: var(--gradient); color: #fff; font-size: 0.68rem; font-weight: 800; padding: 2px 7px; border-radius: 10px; }

    /* Notification toast */
    .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 12px;
      min-width: 300px; max-width: 380px;
      border-left: 4px solid var(--success);
      animation: slideInRight 0.4s ease;
      font-size: 0.875rem; font-weight: 600;
    }
    .toast.info { border-left-color: var(--secondary); }
    .toast.warning { border-left-color: var(--accent); }
    .toast-icon { font-size: 1.3rem; flex-shrink: 0; }
    .toast-close { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0 4px; }
    @keyframes slideInRight { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }
    @keyframes slideOutRight { from { opacity:1; transform: translateX(0); } to { opacity:0; transform: translateX(40px); } }
  </style>
</head>
<body>
  <div class="toast-container" id="toast-container"></div>

  <nav class="navbar">
    <a href="/dashboard" class="navbar-brand">🗳️ Vote<span class="brand-accent">Secure</span></a>
    <div class="navbar-nav">
      <a href="/dashboard" class="nav-link active">🏠 <span>Dashboard</span></a>
      <a href="/results" class="nav-link">📊 <span>Results</span></a>
      <div class="nav-user" id="nav-user"></div>
      <button class="btn btn-ghost btn-sm" onclick="API.logout()">Logout</button>
    </div>
  </nav>

  <div class="container page-content">

    <!-- Hero -->
    <div class="hero-banner fade-in">
      <div>
        <div class="hero-title">Welcome back, <span id="hero-name">Voter</span>! 👋</div>
        <div class="hero-sub">Your voice matters — cast your vote in active elections below</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid-4" style="margin-bottom:2rem">
      <div class="stat-card fade-in">
        <div class="stat-icon blue">🗳️</div>
        <div><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Elections</div></div>
      </div>
      <div class="stat-card green fade-in fade-in-delay-1">
        <div class="stat-icon green">✅</div>
        <div><div class="stat-value" id="stat-active">0</div><div class="stat-label">Active Now</div></div>
      </div>
      <div class="stat-card amber fade-in fade-in-delay-2">
        <div class="stat-icon amber">📊</div>
        <div><div class="stat-value" id="stat-voted">0</div><div class="stat-label">Total Votes</div></div>
      </div>
      <div class="stat-card red fade-in fade-in-delay-3">
        <div class="stat-icon red">🔒</div>
        <div><div class="stat-value" id="stat-closed">0</div><div class="stat-label">Closed</div></div>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="section-heading">🗳️ Elections & Candidates</div>
    <div id="elections-container">
      <div class="empty-state"><span class="icon">⏳</span><p>Loading elections...</p></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!API.requireAuth()) throw new Error('Not authenticated');
    renderNavUser();

    const user = API.user();
    if (user) document.getElementById('hero-name').textContent = user.name.split(' ')[0];

    const selections = {};
    let prevPublishedIds = [];

    // Toast notification
    function showToast(message, type = 'success', duration = 5000) {
      const icons = { success: '🎉', info: 'ℹ️', warning: '⚠️' };
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <span class="toast-icon">${icons[type]}</span>
        <span style="flex:1">${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">×</button>`;
      document.getElementById('toast-container').appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideOutRight 0.4s ease forwards';
        setTimeout(() => toast.remove(), 400);
      }, duration);
    }

    // Check for newly published results and notify voter
    async function checkNotifications() {
      try {
        const elections = await API.get('/elections');
        const publishedIds = elections.filter(e => e.results_published).map(e => e.id);
        publishedIds.forEach(id => {
          if (!prevPublishedIds.includes(id)) {
            const el = elections.find(e => e.id === id);
            if (el) showToast(`📊 Results published for: <strong>${el.title}</strong>`, 'info');
          }
        });
        prevPublishedIds = publishedIds;
      } catch {}
    }

    async function loadElections() {
      try {
        const elections = await API.get('/elections');
        renderStats(elections);
        await renderElections(elections);
      } catch (err) { showAlert('alert', err.message); }
    }

    function renderStats(elections) {
      document.getElementById('stat-total').textContent = elections.length;
      document.getElementById('stat-active').textContent = elections.filter(e => e.status === 'active').length;
      document.getElementById('stat-voted').textContent = elections.reduce((s, e) => s + (e.total_votes || 0), 0);
      document.getElementById('stat-closed').textContent = elections.filter(e => e.status === 'closed').length;
    }

    async function renderElections(elections) {
      const container = document.getElementById('elections-container');
      if (!elections.length) {
        container.innerHTML = '<div class="empty-state"><span class="icon">🗳️</span><h3>No Elections Yet</h3><p>Check back later.</p></div>';
        return;
      }

      // Load all election details with candidates in parallel
      const details = await Promise.all(elections.map(e => API.get(`/elections/${e.id}`)));

      container.innerHTML = details.map((e, i) => `
        <div class="election-section ${e.status} fade-in" style="animation-delay:${i*0.1}s" id="section-${e.id}">

          <!-- Election Header -->
          <div class="election-header">
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
                <div class="election-title">${e.title}</div>
                <span class="badge badge-${e.status}">${e.status}</span>
              </div>
              ${e.description ? `<div class="election-desc">${e.description}</div>` : ''}
              <div class="election-meta">
                <span>📅 ${formatDate(e.start_date)} → ${formatDate(e.end_date)}</span>
                <span>🗳️ ${e.total_votes || 0} votes cast</span>
                <span>👤 ${e.candidates.length} candidates</span>
              </div>
            </div>
          </div>

          <!-- Candidates Section -->
          ${e.status !== 'upcoming' ? `
          <div class="candidates-section">
            <div class="candidates-section-title">👤 Candidates</div>
            ${e.candidates.length ? `
            <div class="candidates-row">
              ${e.candidates.map(c => `
                <div class="candidate-card ${e.status !== 'active' || e.hasVoted ? 'disabled-card' : ''} ${e.votedFor == c.id ? 'selected' : ''}"
                  id="card-${e.id}-${c.id}"
                  ${e.status === 'active' && !e.hasVoted ? `onclick="selectCandidate(${e.id}, ${c.id}, '${c.name.replace(/'/g, "\\'")}')"` : ''}>
                  ${e.status === 'closed' || e.hasVoted ? `<div class="vote-badge">${c.vote_count} votes</div>` : ''}
                  <div class="candidate-avatar">${c.name.charAt(0).toUpperCase()}</div>
                  <div class="candidate-name">${c.name}</div>
                  ${c.party ? `<div class="candidate-party">🏛️ ${c.party}</div>` : ''}
                  ${c.bio ? `<div class="candidate-bio">${c.bio}</div>` : ''}
                  ${e.votedFor == c.id ? `<div style="margin-top:8px;font-size:0.75rem;color:var(--secondary);font-weight:700">✅ Your Vote</div>` : ''}
                </div>`).join('')}
            </div>` : `
            <div class="empty-state" style="padding:1.5rem">
              <span class="icon" style="font-size:2rem">👤</span>
              <p>No candidates added yet.</p>
            </div>`}
          </div>` : `
          <div class="candidates-section">
            <div class="empty-state" style="padding:1.5rem">
              <span class="icon" style="font-size:2rem">⏳</span>
              <p>This election hasn't started yet. Candidates will appear when it becomes active.</p>
            </div>
          </div>`}

          <!-- Vote Action / Status Bar -->
          ${e.status === 'active' && !e.hasVoted ? `
          <div class="vote-action" id="action-${e.id}">
            <div style="font-size:0.83rem;color:var(--text-muted);font-weight:600">
              👆 Click a candidate above to select, then confirm your vote
            </div>
            <div class="vote-confirm-inline" id="confirm-${e.id}">
              <div class="confirm-text">Vote for: <span id="confirm-name-${e.id}"></span></div>
              <button class="btn btn-primary btn-sm" id="vote-btn-${e.id}" onclick="submitVote(${e.id})">✅ Confirm Vote</button>
              <button class="btn btn-outline btn-sm" onclick="cancelVote(${e.id})">Cancel</button>
            </div>
          </div>` :
          e.hasVoted ? `
          <div class="voted-banner">
            ✅ You have already voted in this election
          </div>` :
          e.status === 'closed' ? `
          <div class="vote-action">
            <span style="font-size:0.83rem;color:var(--text-muted);font-weight:600">🔒 This election is closed</span>
            <a href="/results?id=${e.id}" class="btn btn-outline btn-sm">📊 View Results</a>
          </div>` : ''}

        </div>`).join('');
    }

    function selectCandidate(electionId, candidateId, name) {
      // Deselect previous selection for this election
      if (selections[electionId]) {
        const prev = document.getElementById(`card-${electionId}-${selections[electionId]}`);
        if (prev) prev.classList.remove('selected');
      }

      // Select new candidate
      selections[electionId] = candidateId;
      document.getElementById(`card-${electionId}-${candidateId}`).classList.add('selected');

      // Show confirm bar
      document.getElementById(`confirm-name-${electionId}`).textContent = name;
      document.getElementById(`confirm-${electionId}`).classList.add('show');
    }

    function cancelVote(electionId) {
      if (selections[electionId]) {
        const card = document.getElementById(`card-${electionId}-${selections[electionId]}`);
        if (card) card.classList.remove('selected');
        delete selections[electionId];
      }
      document.getElementById(`confirm-${electionId}`).classList.remove('show');
    }

    async function submitVote(electionId) {
      const candidateId = selections[electionId];
      if (!candidateId) return;

      const btn = document.getElementById(`vote-btn-${electionId}`);
      setLoading(btn, true);
      try {
        await API.post('/votes', { election_id: electionId, candidate_id: candidateId });
        showToast('🎉 Your vote has been cast successfully!');
        showAlert('alert', '🎉 Your vote has been cast successfully!', 'success');
        delete selections[electionId];
        loadElections(); // Reload to show voted state
      } catch (err) {
        showAlert('alert', err.message);
        setLoading(btn, false);
      }
    }

    loadElections();
    checkNotifications();
    // Auto-refresh every 30 seconds
    setInterval(() => { loadElections(); checkNotifications(); }, 30000);
  </script>
</body>
</html>
